services:
    db:
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - db-data:/var/lib/postgresql
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - backend

    api:
        build: ./api
        environment:
            DB_HOST: db
            DB_NAME: ${POSTGRES_DB}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
        deploy:
            replicas: 3
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128M
        networks:
            - proxy-back
            - backend

    web:
        build: ./web
        networks:
            - proxy-front

    proxy:
        image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
        ports:
            - "8080:80"
        volumes:
            - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - proxy-front
            - proxy-back
        depends_on:
            - web
            - api

networks:
    proxy-front:
    proxy-back:
    backend:

volumes:
    db-data:
