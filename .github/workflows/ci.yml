name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_pgsql

            - name: Install dependencies (Cache)
              uses: ramsey/composer-install@v3
              with:
                  working-directory: api

            - name: Run tests
              run: |
                  cd api
                  composer install
                  vendor/bin/phpunit

    docker:
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract version
              id: get_version
              run: echo "VERSION=$(jq -r .version api/composer.json)" >> $GITHUB_ENV

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: ./api
                  push: true
                  tags: |
                      ${{ vars.DOCKERHUB_USERNAME }}/tp-msii-api:latest
                      ${{ vars.DOCKERHUB_USERNAME }}/tp-msii-api:${{ env.VERSION }}
